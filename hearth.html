<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#131117">
<title>Hearth</title>
<style>
:root{
  --bg:#131117;--panel:#1c1922;--panel2:#25212d;--line:#342e3f;--text:#ede9f3;--muted:#9f96ad;
  --accent:#c48cf0;--accent-ink:#1a1022;--accent2:#8d5ed6;--danger:#f0707a;--q:#f2c879;--ok:#6fd3a1;
  --r:14px;--fs:15px;--tabh:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto;position:relative}
#tempbar,#updbar{margin:8px 12px 0;padding:10px 12px;border:1px solid var(--q);border-radius:12px;background:color-mix(in srgb,var(--q) 12%,var(--panel));font-size:13px;flex:none}
#updbar{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,var(--panel))}
#tempbar .row,#updbar .row{margin-top:8px;align-items:center}
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted)}
#tabs a.on{color:var(--accent)}
#app.notabs #tabs{display:none}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;padding:8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.ib:active{background:var(--panel2)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--panel2);color:var(--text);font-weight:500}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 50%,transparent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pad{padding:12px 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}

input[type=text],input[type=password],input[type=number],input[type=url],input:not([type]),textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:80px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted);margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.search{border-radius:999px!important;padding-left:16px!important}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 16px 100px}
.card{background:var(--panel);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--panel2)}
.card .ci{padding:8px 10px 10px}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;background:var(--panel2);color:var(--muted);padding:2px 8px;border-radius:999px}
.fab{position:fixed;right:max(18px,calc(50vw - 392px));bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #0008;cursor:pointer;z-index:4}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

.hero{position:relative;padding:24px 16px 16px;text-align:center;overflow:hidden}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) brightness(.45);transform:scale(1.2)}
.hero .bgimg.sharp{filter:brightness(.5);transform:none}
.hero>*:not(.bgimg){position:relative}
.hero img.big{width:150px;height:200px;object-fit:cover;border-radius:16px;border:2px solid #fff3;box-shadow:0 8px 30px #000a}
.hero h2{margin:12px 0 2px;font-size:22px}
.hero .tags{justify-content:center}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.li img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.on{border-color:var(--accent2)}
.sec{margin:18px 16px;}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.box summary{cursor:pointer;font-weight:600}
.pre{white-space:pre-wrap;word-break:break-word}

/* editor */
.editor{padding:8px 16px 120px}
.pics{display:flex;gap:12px;align-items:flex-end;margin-top:8px}
.pic{position:relative;cursor:pointer;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.av{width:110px;height:146px}
.pic.bn{flex:1;height:146px}
.pic .lbl{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:11px;padding:3px}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:6}
.savebar>div{max-width:788px;margin:0 auto;display:flex;gap:8px}
.alt{position:relative;margin-bottom:8px}
.alt .ib{position:absolute;right:4px;top:4px}
.script{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.script .srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.script textarea{min-height:140px;background:var(--bg);tab-size:2}
.sw{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.sw span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--accent2)}
.sw input:checked+span::after{transform:translateX(18px)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
input[type=range]{width:100%;accent-color:var(--accent)}

/* chat */
.chat{display:flex;flex-direction:column;height:100%;position:relative}
.chat::before{content:"";position:absolute;inset:0;background:var(--chatbg,none) center/cover;opacity:.18;pointer-events:none}
.chat>*{position:relative}
.chat header.top img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.chat header .ct{flex:1;min-width:0;line-height:1.2}
.chat header .ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat header .ct small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;margin-top:2px}
.msg .mw{flex:1;min-width:0}
.msg .nm{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--accent)}
.msg.user .nm{color:var(--muted)}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 13px;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer}
.msg.user .bubble{background:var(--panel2)}
.bubble em{color:#c9bfd6;font-style:italic}
.bubble .q{color:var(--q)}
.bubble img{max-width:100%;border-radius:10px;display:block;margin:6px 0}
.bubble textarea{min-height:120px;margin-bottom:8px;cursor:text}
.mact{display:none;gap:4px;margin-top:6px;flex-wrap:wrap}
.msg.open .mact{display:flex}
.mact button{background:var(--panel2);border:0;border-radius:9px;padding:5px 9px;font-size:12px;display:inline-flex;gap:4px;align-items:center;cursor:pointer;color:var(--text)}
.mact button svg{width:15px;height:15px}
.swipes{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.swipes button{background:var(--panel2);border:0;border-radius:9px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:16px;line-height:1}
.swipes button:disabled{opacity:.35}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.composer textarea{min-height:44px;max-height:40vh;resize:none;border-radius:22px;padding:11px 16px;background:var(--bg)}
.composer .btn{width:44px;height:44px;border-radius:50%;padding:0;flex:none}
.composer .btn.stop{background:var(--danger)}

.entry{margin-bottom:8px;padding:10px 12px}
.entry>summary{display:flex;gap:6px;align-items:center;font-weight:600;cursor:pointer;list-style:none}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary .et{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--panel);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:12px;border-top:1px solid var(--line);z-index:2}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:#0009}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--panel);border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto;animation:up .18s ease-out}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 10px}
#sheet h2{font-size:18px;margin:4px 0 8px}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.menu button{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:var(--text)}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.chip.mem{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;font-size:13px}
.chip.mem img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.chip svg{width:16px;height:16px;vertical-align:-3px}
.chips .chip[data-act=kind]{padding:7px 14px;font-size:14px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent2) 30%,var(--panel2))}
.bubble img.spk{display:inline-block;width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:top;vertical-align:-5px;margin:0 5px 0 0}
.cast{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.cast img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff3}
.tag.world{background:var(--accent2);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.err{color:var(--danger)}
.okc{color:var(--ok)}
.lookups{font-size:12px;color:var(--muted);margin-top:5px}
.scenelinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg.hasscene .bubble{border-left:3px solid var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.msg.hasscene .nm::after{content:'  ◆ scene';color:var(--accent);font-weight:400;font-size:11px}
.scenelinks .chip,.fromworld{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;padding:5px 12px}
.fromworld{width:100%;justify-content:center;margin:2px 0 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);cursor:pointer}
.fromworld svg{width:16px;height:16px}
.rolebar{display:flex;align-items:center;gap:10px;margin:-4px 0 12px;padding:8px 12px;border:1px dashed var(--accent);border-radius:12px;font-size:13px;color:var(--muted)}
.rolebar span{flex:1}
.msg.flash .bubble{outline:2px solid var(--accent);outline-offset:2px;transition:outline-color 1s}
.msgwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.msgwrap .msgs{flex:1}
.jump{position:absolute;right:12px;bottom:12px;z-index:3;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:50%;box-shadow:0 4px 16px #0008;cursor:pointer;opacity:.92}
.jump svg{width:20px;height:20px}
.cp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.cp-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cp-h b{flex:1;font-size:13px}
.cp-t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;user-select:text}
.cp-panel{font-size:15px;margin:16px 0 2px}
.storycards{margin-top:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:10px;background:var(--panel2);cursor:pointer;display:block}
.thumbs img.main{outline:2px solid var(--accent);outline-offset:-2px}
.thumb-add{aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted);font-size:26px;cursor:pointer}
.mw .thumbs{margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.nextsug{display:flex;gap:10px;align-items:center;margin-top:8px;padding:8px 10px;border:1px dashed var(--accent2);border-radius:12px;font-size:13px}
.nextsug>div{flex:1}
.chatrow{align-items:flex-start}
.cr-av{position:relative;flex:none}
.cr-av img{object-position:top}
.cr-badge{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)}
.cr-badge svg{width:11px;height:11px}
.cr-top{display:flex;align-items:center;gap:6px;min-width:0}
.cr-top b{min-width:0}
.cr-top .tag{flex:none;font-size:10.5px;padding:1px 7px}
.tag.img{background:color-mix(in srgb,var(--accent2) 35%,var(--panel2));color:var(--text)}
.li .lt .cr-about,.li .lt .cr-last{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.li .lt .cr-about{color:var(--text);font-size:13.5px;-webkit-line-clamp:2;margin-top:2px}
.li .lt .cr-last{font-size:12.5px;-webkit-line-clamp:2;margin-top:3px}
.cr-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.fbar{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar .chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:13px;margin:0}
.fbar .chip svg{width:15px;height:15px;vertical-align:0}
.fbar .n{color:var(--muted);font-size:11.5px}
.vtabs{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.vtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer}
.vtabs button.on{background:var(--panel2);color:var(--text);border-color:var(--accent2)}
.vtabs svg{width:16px;height:16px}
.reader{max-width:680px;margin:0 auto;width:100%;padding:2px 4px 30px}
.rd-title{font:600 22px/1.3 Georgia,"Noto Serif",serif;margin:6px 0 18px}
.rd-miss{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.rd-sec{margin:0 0 34px}
.rd-pics{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.rd-pics img{width:100%;border-radius:12px;display:block;background:var(--panel2);cursor:zoom-in}
.rd-nopic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px;margin-bottom:12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;text-align:center}
.rd-text,.storytxt{font:16.5px/1.75 Georgia,"Noto Serif",serif}
.rd-text p,.storytxt p{margin:0 0 .8em}
.rd-text .q,.storytxt .q{color:inherit}
.rd-act{display:flex;gap:4px;margin-top:2px}
.rd-act button{background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 6px}
.rd-act svg{width:14px;height:14px}
.storytxt{margin-top:8px;padding:8px 12px 2px;border-left:3px solid var(--accent2);background:var(--panel2);border-radius:8px;font-size:14.5px;line-height:1.6}
.controw{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.tokl{font-size:10.5px;line-height:1.3;color:var(--muted);opacity:.7;margin-top:3px;padding-left:2px}
.status{font-size:13px;color:var(--muted);margin-bottom:4px}
[data-act=zoom]{cursor:zoom-in}
#lightbox{position:fixed;inset:0;z-index:40;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lightbox.on{display:flex;animation:fade .15s ease-out}
#lightbox img{max-width:100%;max-height:88dvh;border-radius:16px;box-shadow:0 10px 40px #000;object-fit:contain}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="tempbar" hidden></div>
  <div id="updbar" hidden></div>
  <main id="view"></main>

// Asks the AI to fold the messages since the last update into the chat memory.
const memBusy=new Set();
async function updateMemory(chat,char,manual){

const sceneBusy=new Set();

async function updateScene(chat,char,o={}){

  const api=sceneApi();if(!api){if(o.manual)throw new Error('Add an API / proxy in Settings first');return null}

    const {text,used}=await callApi(api,[
      {role:'system',content:'You keep track of the physical state of a roleplay scene. You are exact and brief.'},
      {role:'user',content:`${char.kind==='world'?`A story set in ${char.name}. Main characters: ${cast.join(', ')}.`:`Characters: ${char.name} and ${un}.`} ${userAway(chat)?`${un} is the user, who is not in the scene and only directs it: never list ${un} as present.`:`${un} is the user.`}

${base?.trim()||'(none yet)'}

${tr}

Place and time: …
Present: everyone in the scene right now

    ],undefined,()=>{},{stream:false,maxTokens:600});

const POSNUM={before:0,after:1,depth:4};
const newBook=name=>({id:uid(),name:name||'Lorebook',enabled:true,scanDepth:4,tokenBudget:2048,entries:[]});
const newEntry=()=>({id:uid(),keys:[],secondaryKeys:[],logic:0,content:'',comment:'',enabled:true,constant:false,order:100,position:'after',depth:4,probability:100,caseSensitive:false,wholeWords:false,look:''});

const isWorldInfo=j=>!!j?.entries&&!j.spec&&!j.data&&!('first_mes' in j)&&!('char_greeting' in j);
const escRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function keyMatch(key,text,e){

// Returns the entries triggered by the last messages, grouped by where they go in the prompt.
function activateLore(books,texts){
  const out={before:[],after:[],depth:[],names:[]};
  for(const b of books){
    const scan=texts.slice(-(b.scanDepth||4)).join('\n');
    const hits=b.entries.filter(e=>{
      if(!e.enabled||!e.content?.trim())return false;
      if(!e.constant&&!(e.keys.some(k=>keyMatch(k,scan,e))&&secondaryOk(e,scan)))return false;
      return (e.probability??100)>=100||Math.random()*100<e.probability;
    }).sort((a,b)=>(b.constant-a.constant)||(b.order-a.order));
    let budget=b.tokenBudget||2048;const kept=[];
    for(const e of hits){const t=est(e.content);if(t>budget)continue;budget-=t;kept.push(e)}
    kept.sort((a,b)=>a.order-b.order);
    for(const e of kept){
      if(e.position==='depth')out.depth.push({depth:e.depth,text:e.content});else out[e.position==='before'?'before':'after'].push(e.content);
      out.names.push(`${b.name}: ${e.comment||e.keys.join(', ')||'entry'}${e.constant?' (always on)':''}`);

      const dl=j.choices?.[0]?.delta||{},t=dl.content??j.choices?.[0]?.text??'',th=dl.reasoning||dl.reasoning_content||'';

/* ---------- web lookups: the AI can search Wikipedia / Fandom wikis through tools ---------- */
function wikiApi(w){
  w=String(w||'').trim();
  if(!w||/^wikipedia$/i.test(w))return `https://${S.settings.wikiLang||'en'}.wikipedia.org/w/api.php`;
  if(/^https?:\/\//i.test(w)){const u=new URL(w);if(/api\.php$/.test(u.pathname))return u.origin+u.pathname;if(!u.hostname.endsWith('.fandom.com'))return u.origin+'/w/api.php';w=u.hostname}
  const sub=w.toLowerCase().replace(/\.fandom\.com.*$/,'').replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
  return `https://${sub}.fandom.com/api.php`;
}
const wikiLabel=w=>!w||/^wikipedia$/i.test(w)?'Wikipedia':/^https?:/i.test(w)?new URL(w).hostname:`${w} wiki`;
async function mw(w,params){
  let r;
  try{r=await fetch(wikiApi(w)+'?'+new URLSearchParams({...params,format:'json',formatversion:'2',origin:'*'}))}
  catch{throw new Error(`could not reach ${wikiLabel(w)} (the wiki may not exist, or you are offline)`)}
  if(!r.ok)throw new Error(`${wikiLabel(w)} returned HTTP ${r.status}`);
  const j=await r.json();if(j.error)throw new Error(j.error.info||j.error.code);return j;
}
const htmlText=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent.replace(/\s+/g,' ').trim();
async function wikiSearch(query,w){
  const j=await mw(w,{action:'query',list:'search',srsearch:query,srlimit:'6'});
  const r=j.query?.search||[];
  return r.length?r.map(x=>`- ${x.title}: ${htmlText(x.snippet)}`).join('\n'):`No results on ${wikiLabel(w)} for "${query}".`;
}
const pageCache=new Map();
async function wikiPage(title,w,max){
  max=max||+S.settings.webMaxChars||5000;

  const j=await mw(w,{action:'parse',page:title,redirects:'1',prop:'text'});

  doc.querySelectorAll('style,script,sup,.mw-editsection').forEach(n=>n.remove());

  doc.querySelectorAll('.infobox li,.pi-data-value li').forEach(li=>li.append(', '));
  // keep infobox facts (Fandom portable infobox and Wikipedia infobox) as "Label: value" lines
  const val=n=>n.textContent.replace(/\s+/g,' ').replace(/(,\s*)+$/,'').trim();
  doc.querySelectorAll('.portable-infobox .pi-data').forEach(d=>{const l=d.querySelector('.pi-data-label'),v=d.querySelector('.pi-data-value');if(l&&v&&val(v))out.push(`${val(l)}: ${val(v)}`)});

  doc.querySelectorAll('aside,table,style,script,sup,figure,.mw-editsection,.toc,#toc,.navbox,.gallery,.thumb,.reflist,.references,.mw-references-wrap,.noprint,.hatnote,.printfooter').forEach(n=>n.remove());

function webTools(char){
  const w=char.wiki?.trim();

    {type:'function',function:{name:'search_wiki',description:`Search a wiki for characters, places, events or lore you don't know well. Returns page titles with short snippets.${w?` This story's wiki is "${w}".`:''}`,
      parameters:{type:'object',properties:{query:{type:'string',description:'What to look for, e.g. a character name'},wiki:{type:'string',description:`"wikipedia", or a Fandom wiki name such as "${w||'naruto'}" (the part before .fandom.com)`}},required:['query']}}},
    {type:'function',function:{name:'read_wiki_page',description:'Read a wiki page. Use an exact title from search_wiki. Returns the page text.',
      parameters:{type:'object',properties:{title:{type:'string',description:'Exact page title'},wiki:{type:'string',description:'Same wiki as the search'}},required:['title']}}}

async function runTool(tc,char){
  let a={};try{a=JSON.parse(tc.function.arguments||'{}')}catch{}
  const w=a.wiki||char.wiki||'wikipedia';

    if(tc.function.name==='search_wiki')return {label:`searched ${wikiLabel(w)} for “${a.query}”`,result:await wikiSearch(String(a.query||''),w)};

/* ---------- reference links: pages the user saves on a character ---------- */
const REF_MAX=20000;
// Reader-service markdown is full of menus and links: keep headings, facts and real sentences.
function cleanMarkdown(md){
  const t=md.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/<[^>]+>/g,'');
  const out=[];
  for(let l of t.split('\n')){
    l=l.replace(/^\s*[*+-]\s+/,'• ').replace(/\s+/g,' ').trim();
    if(/cookie|opt[- ]?(in|out)\b|opted (in|out)|privacy (policy|settings)|personal (data|information)|all rights reserved|sign up|log ?in\b/i.test(l))continue;
    if(/^#{1,4}\s+\S/.test(l)||l.length>=40||(/\S:\s*\S/.test(l)&&l.length<160&&l.length>=6))if(out.at(-1)!==l)out.push(l);
  }
  return out.join('\n');
}
function readableHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript,nav,header,footer,aside,form,iframe,svg,button').forEach(n=>n.remove());
  const root=doc.querySelector('main,article,[role=main],#content,.content')||doc.body,out=[];
  for(const n of root.querySelectorAll('h1,h2,h3,h4,p,li,dt,dd,blockquote')){const t=n.textContent.replace(/\s+/g,' ').trim();if(t&&out.at(-1)!==t)out.push(/^H/.test(n.tagName)?'## '+t:t)}
  return {title:doc.title.trim(),text:out.join('\n')};
}
// Wikis are read through their API; other sites directly if they allow it, else through the reader service.
async function fetchRef(url){
  let u;try{u=new URL(url.trim())}catch{throw new Error("That doesn't look like a link. It should start with https://")}
  const m=u.pathname.match(/^(\/[a-z]{2,3}(?:-[a-z]+)?)?\/wiki\/(.+)$/i);
  if(m){
    const title=decodeURIComponent(m[2]).replace(/_/g,' ');
    const apis=/\.wiki(pedia|media|quote|books|source|voyage)\.org$/.test(u.hostname)?[u.origin+'/w/api.php']:u.hostname.endsWith('.fandom.com')?[u.origin+(m[1]||'')+'/api.php']:[u.origin+'/api.php',u.origin+'/w/api.php'];
    for(const api of apis){try{return {title,text:await wikiPage(title,api,REF_MAX),via:'wiki'}}catch{}}
  }
  try{const r=await fetch(u.href);if(r.ok){const raw=await r.text(),p=(r.headers.get('content-type')||'').includes('html')?readableHtml(raw):{title:'',text:raw};if(p.text.trim().length>200)return {title:p.title||u.hostname,text:p.text.slice(0,REF_MAX),via:'direct'}}}catch{}
  if(!S.settings.readerProxy)throw new Error("This site doesn't let apps read it directly. Turn on the reader service in Settings → Web lookups, or use “Paste text” instead.");
  let r;try{r=await fetch('https://r.jina.ai/'+u.href)}catch{throw new Error('Could not reach the reader service. Check your connection.')}
  if(!r.ok)throw new Error(`The reader service returned HTTP ${r.status}${r.status===429?' (too many requests, wait a minute)':''}.`);
  const md=await r.text(),title=((md.match(/^Title:\s*(.+)$/m)||[])[1]||u.hostname).trim();
  const text=cleanMarkdown(md.includes('Markdown Content:')?md.slice(md.indexOf('Markdown Content:')+17):md);
  if(text.length<300)throw new Error(/just a moment|captcha/i.test(md.slice(0,600))?'That site blocked the reader with a CAPTCHA. Copy the text from the page and use “Paste text”.':'Almost no text came back from that page. Try another link, or use “Paste text”.');
  return {title,text:text.slice(0,REF_MAX),via:'reader'};
}
async function condenseRef(text,charName){

    {role:'user',content:`Summarize what this page says about ${charName||'the character'} as notes for an AI that will roleplay as or with them. Cover, where the page has it: appearance; personality and behaviour; speech style, catchphrases and how they address others; abilities; key relationships; important history; likes and dislikes. Use short bullet points under those headings, at most 400 words. Skip real-world production details and anything not about the character.\n\nPAGE:\n${text.slice(0,24000)}`}

function researchApi(model=S.settings.researchModel){const base=S.settings.apis.find(a=>a.id===S.settings.researchApi)||activeApi();return base&&{...base,model:String(model||'').trim()}}
// Asks the research model, giving it the wiki tools when it can use them (models with built-in web search may refuse tools).
async function research(system,user,char,signal,onStatus,model){
  const api=researchApi(model);if(!api)throw new Error('Pick a connection for the research model in Settings');
  // models that refused the tools once (like perplexity/sonar) aren't offered them again this session
  const noTools=(S.ui.noTools??=new Set());
  let msgs=[{role:'system',content:system},{role:'user',content:user}],tools=noTools.has(api.model)?null:webTools(char);
  const labels=[],usage={in:0,out:0,est:false};
  for(let round=0;;round++){
    const useTools=!!tools&&round<(+S.settings.webRounds||3);let r;
    try{r=await callApi(api,msgs,signal,()=>{},{stream:false,maxTokens:900,...(useTools?{tools}:{})})}
    catch(e){if(useTools&&round===0&&(e.status===400||e.status===404||e.status===422||/tool|function/i.test(e.message))){tools=null;noTools.add(api.model);continue}throw e}
    if(r.usage){usage.in+=r.usage.in;usage.out+=r.usage.out;addCost(usage,r.usage)}
    else{const i=est(msgs.map(m=>m.content||'').join('')),o=est(r.text);usage.in+=i;usage.out+=o;usage.est=true;addCost(usage,{cost:priceCost(api,i,o),costEst:true})}
    if(!useTools||!r.toolCalls?.length)return {text:stripThink(r.text||'').trim(),labels,usage};
    msgs=[...msgs,{role:'assistant',content:r.text||null,tool_calls:r.toolCalls}];
    for(const tc of r.toolCalls){
      let a={};try{a=JSON.parse(tc.function.arguments||'{}')}catch{}
      onStatus?.(tc.function.name==='read_wiki_page'?`Reading “${a.title||''}”…`:`Searching ${wikiLabel(a.wiki||char.wiki)} for “${a.query||''}”…`);
      const {label,result}=await runTool(tc,char);labels.push(label);msgs.push({role:'tool',tool_call_id:tc.id,content:result});
    }
  }
}

// "Only when new names appear": capitalised words inside a sentence that the chat hasn't seen before.
// The first word of each sentence is skipped, since it's capitalised anyway.
const NAME_STOP=new Set(('The A An I Im It’s Its She He They It You We Me My Your His Her Their Our Us Him Them What Why How When Where Who Whom Which This That These Those But And Or So Then Yes No Oh Ah Eh Hmm Um Uh Well Okay Ok OK Hey Hello Hi Please Thank Thanks Sorry Maybe Just Now Still Even Not Is Are Was Were Do Does Did Can Could Will Would Should Let Lets If As At In On Of For With From To By Up Out Into Over After Before Again Also Very Really Here There Some Any All One Two Every Each Mr Mrs Ms Miss Sir Madam Lady Lord Good Fine Sure Right Wait Look Come Go Stop Don’t Can’t Won’t I’m I’ll I’ve I’d You’re OOC').split(' '));
function namesIn(text){
  const out=new Set();
  for(const sent of String(text||'').replace(/[*_"“”()\[\]]/g,' ').split(/(?<=[.!?…])\s+|\n+/))
  {
    // neighbouring capitalized words stay together as one name ("Demon King")
    let run=[];const end=()=>{if(run.length)out.add(run.join(' '));run=[]};
    sent.trim().split(/\s+/).forEach((w,i)=>{
      const c=w.replace(/^[^\p{L}]+|[^\p{L}'’-]+$/gu,'');
      if(i>0&&/^\p{Lu}[\p{L}'’-]{2,}$/u.test(c)&&!NAME_STOP.has(c)){run.push(c);if(/[,;:]$/.test(w))end()}else end();
    });end();
  }
  return out;
}
function newNames(chat,char,idx){
  const parts=new Set([char,...membersOf(char),personaFor(chat)].flatMap(x=>String(x?.name||'').split(/\s+/)));
  const known={has:n=>n.split(' ').every(p=>parts.has(p))};
  const msgs=chat.messages.slice(0,idx),recent=msgs.slice(-2);
  if(!chat.seenNames)chat.seenNames=[...new Set(msgs.slice(0,-2).flatMap(m=>[...namesIn(txt(m))]))];
  const seen=new Set(chat.seenNames),now=[...new Set(recent.flatMap(m=>[...namesIn(txt(m))]))];
  const fresh=now.filter(n=>!seen.has(n)&&!known.has(n));
  chat.seenNames=[...new Set([...chat.seenNames,...now])].slice(-500);
  return fresh;
}

  if(chat.researchNotes?.trim())sys.push(`[Canon facts looked up during this chat]\n${chat.researchNotes.trim()}`);
  if(st.webSearch&&!researchOn())sys.push(webNote(char));
  sys.push('Physical continuity: keep track of where everyone is, what they hold and wear, and anything that limits them. A character can only do what their situation allows: someone whose hands are tied cannot pick up a spoon, someone gagged cannot speak clearly, someone who left the room is not there.');
  // the current scene goes near the end, where models pay the most attention
  const scene=chat.scene?.trim()?mac(`[The scene right now. Stay consistent with it unless the story changes it:\n${chat.scene.trim()}]`):'';
  const sysText=mac(sys.join('\n\n')),note=ctx.system_note?mac(ctx.system_note):'',reminder=char.reminder?.trim()?mac(`[Reminder: ${char.reminder.trim()}]`):'';
  let budget=(+st.contextSize||16000)-(+st.maxTokens||0)-est(sysText)-est(note)-est(reminder)-est(scene)-est(lore.depth.map(d=>d.text).join(''))-50;
  const hist=[];
  for(let i=history.length-1;i>=0;i--){const c=mac(txt(history[i]));if(!c.trim())continue;const t=est(c)+4;if(budget-t<0&&hist.length)break;budget-=t;hist.unshift({role:history[i].role,content:c})}
  if(!hist.length||hist[0].role!=='user')hist.unshift({role:'user',content:'(The roleplay begins.)'});
  for(const d of [...lore.depth].reverse())hist.splice(Math.max(0,hist.length-d.depth),0,{role:'system',content:mac(d.text)});
  const messages=[{role:'system',content:sysText},...hist];
  if(scene)messages.push({role:'system',content:scene});
  const rn=roleNote(chat,userName);if(rn)messages.push({role:'system',content:rn});
  if(reminder)messages.push({role:'system',content:reminder});
  if(note)messages.push({role:'system',content:note});
  return {messages,ctx,errs,lore:lore.names};
}

/* ---------- character wizard: research a character online, then let the AI write it ---------- */
function guessWikis(src){
  const s=src.toLowerCase().replace(/['’.!?]/g,''),slug=x=>x.trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  const main=slug(s.split(/\s*[:(|–—]\s*|\s-\s/)[0]),full=slug(s);
  return [...new Set([full,full.replace(/-/g,''),main,main.replace(/-/g,''),main.split('-')[0]])].filter(x=>x.length>1);
}
function bestHit(hits,name){
  const n=name.toLowerCase().trim(),first=n.split(/\s+/)[0],main=hits.filter(h=>!h.title.includes('/')),t=h=>h.title.toLowerCase();
  return main.find(h=>t(h)===n)||main.find(h=>t(h).startsWith(n))||main.find(h=>t(h).split(/[\s(]/)[0]===first)||null;
}
// Reads the JSON object in an AI answer, repairing what models often get wrong: code fences and text around it, // comments,
// trailing commas, raw line breaks inside strings, and an answer cut off midway (kept up to its last complete item; marked _cut).
function repairJson(s){
  const t=String(s||'').replace(/```(?:json)?/gi,''),start=t.indexOf('{');if(start<0)return null;
  let out='',stack=[],inStr=false,esc=false,safe=-1,safeStack=[];
  for(let k=start;k<t.length;k++){
    const ch=t[k];
    if(inStr){
      if(esc){out+=ch;esc=false}else if(ch==='\\'){out+=ch;esc=true}else if(ch==='"'){out+=ch;inStr=false}
      else if(ch==='\n')out+='\\n';else if(ch==='\t')out+='\\t';else if(ch!=='\r')out+=ch;
      continue;
    }
    if(ch==='"'){inStr=true;out+=ch}
    else if(ch==='/'&&t[k+1]==='/'){while(k<t.length&&t[k]!=='\n')k++}
    else if(ch==='{'||ch==='['){stack.push(ch==='{'?'}':']');out+=ch}
    else if(ch==='}'||ch===']'){out=out.replace(/,\s*$/,'')+ch;stack.pop();if(!stack.length)return {json:out,cut:false};safe=out.length;safeStack=[...stack]}
    else if(ch===','){safe=out.length;safeStack=[...stack];out+=ch}
    else out+=ch;
  }
  if(safe<0)return null; // cut off before anything was complete
  return {json:out.slice(0,safe).replace(/[,:\s]+$/,'')+safeStack.reverse().join(''),cut:true};
}
function parseJsonLoose(s){
  const r=repairJson(s);
  if(!r)throw new Error("The AI didn't send a usable answer. Try again, or try another model.");
  let j;try{j=JSON.parse(r.json)}catch{throw new Error("The AI's answer wasn't valid JSON. Try again, or try another model.")}
  if(!j||typeof j!=='object')throw new Error("The AI didn't send a usable answer. Try again, or try another model.");
  if(r.cut)Object.defineProperty(j,'_cut',{value:true});
  return j;
}
// Asks for an answer as JSON. A cut-off answer is asked for once more with twice the room, an unreadable one is asked
// to be sent again; if the second answer is still cut off, what arrived is used. usage adds up both tries.
async function callJson(api,messages,signal,o={}){
  let max=o.maxTokens||2000,usage={in:0,out:0,est:false},msgs=messages;
  const words=m=>typeof m.content==='string'?m.content:(m.content||[]).map(p=>p.type==='text'?p.text:' [image] ').join(' ');
  for(let attempt=0;;attempt++){
    const r=await callApi(api,msgs,signal,()=>{},{stream:false,maxTokens:max,json:true});
    let u=r.usage;
    if(!u){const i=est(msgs.map(words).join('\n'))+(msgs.some(m=>Array.isArray(m.content))?1000:0),o=est(r.text);u={in:i,out:o,cost:priceCost(api,i,o),costEst:true}}
    usage=addCost({...usage,in:usage.in+u.in,out:usage.out+u.out,est:usage.est||!r.usage},u);
    const text=stripThink(r.text||''),cut=/^(length|max_tokens)$/.test(r.finish||'');
    let j=null,err=null;try{j=parseJsonLoose(text)}catch(e){err=e}
    if(j&&!cut&&!j._cut)return {j,text,usage};
    if(attempt>=1){
      if(j)return {j,text,usage,cut:true};
      throw cut?new Error("The AI's answer was cut off twice, even with more room. Try asking for less (fewer images or shorter text), or try another model."):err;
    }
    if(cut||j?._cut)max=Math.min(16000,max*2);
    else msgs=[...messages,{role:'assistant',content:text.slice(0,6000)},{role:'user',content:'Your answer could not be read as JSON. Send the same answer again as one valid JSON object only, with nothing before or after it.'}];
  }
}

// Reads the series' main wiki page, its character list and Wikipedia into sources.
async function readSeries(inp,sources,log,signal){
  let wiki='',image=null;
  log('Looking for a Fandom wiki…');
  for(const w of inp.wiki?[inp.wiki]:guessWikis(inp.source)){
      if(signal.aborted)return {wiki,image};
      let hits;try{hits=(await mw(w,{action:'query',list:'search',srsearch:inp.source,srlimit:'8'})).query?.search||[]}catch{continue}
      wiki=w;
      const base=wikiApi(w).replace(/\/api\.php$/,''),link=t=>`${base}/wiki/${encodeURIComponent(t.replace(/ /g,'_'))}`;
      const picks=hits.filter(h=>!h.title.includes('/')).slice(0,1);
      try{const ch=((await mw(w,{action:'query',list:'search',srsearch:'list of characters',srlimit:'8'})).query?.search||[]).find(h=>/characters/i.test(h.title)&&!h.title.includes('/'));if(ch&&!picks.some(p=>p.title===ch.title))picks.push(ch)}catch{}
      for(const p of picks)try{sources.push({title:`${p.title} (${wikiLabel(w)})`,url:link(p.title),text:await wikiPage(p.title,w,9000)});log(`✓ Read “${p.title}” on the ${wikiLabel(w)}`,'okc')}catch{}
      if(picks[0])try{image=await wikiImage(w,picks[0].title);if(image)log('✓ Got a picture','okc')}catch{}
      break;
    }
    if(!wiki)log('· No Fandom wiki found. Tip: type the wiki name (e.g. frieren) or paste a link.');
    try{
      const hits=(await mw('wikipedia',{action:'query',list:'search',srsearch:inp.source,srlimit:'3'})).query?.search||[];
      const key=inp.source.toLowerCase().split(/[\s:]/)[0],h=hits.find(x=>x.title.toLowerCase().includes(key));
      if(h){sources.push({title:`${h.title} (Wikipedia)`,url:`https://${S.settings.wikiLang||'en'}.wikipedia.org/wiki/${encodeURIComponent(h.title.replace(/ /g,'_'))}`,text:await wikiPage(h.title,'wikipedia',15000)});log(`✓ Read “${h.title}” on Wikipedia`,'okc')}
    }catch{}
  return {wiki,image};
}

// Pick a scenario and who to play, then start. Skipped when there's nothing to choose.
function openStart(c,pre={}){
  const scs=scenariosOf(c),defP=S.settings.activePersona||S.personas[0]?.id;
  let scId=scs.some(s=>s.id===pre.scenarioId)?pre.scenarioId:scs[0].id;
  const scOf=()=>scs.find(s=>s.id===scId);
  let pId=scOf().personaId||pre.personaId||defP,picked=false;
  if(scs.length<2&&S.personas.length<2)return startChat(c.id,pId,scId);
  const pn=openSheet(`<h2>New chat with ${esc(c.name)}</h2>
    ${scs.length>1?`<h3 class="small muted" style="margin:12px 0 8px;text-transform:uppercase;letter-spacing:.06em">Scenario</h3><div class="list">${scs.map(s=>`<div class="li sc-pick" data-act="sc" data-id="${s.id}"><div class="lt"><b>${esc(s.name||'Scenario')}</b><span>${esc((s.scenario||s.greetings[0]||'').replace(/\s+/g,' ').slice(0,100))}</span></div></div>`).join('')}</div>`:''}
    ${S.personas.length>1?`<h3 class="small muted" style="margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em">Play as</h3><div class="chips">${S.personas.map(p=>`<button type="button" class="chip mem p-pick" data-act="p" data-id="${p.id}"><img src="${esc(avatar(p))}" alt="">${esc(p.name)}</button>`).join('')}</div>`:''}
    <div class="box small pre muted" id="st-prev" style="margin-top:14px;max-height:150px;overflow:auto"></div>
    <div class="sheet-foot"><button class="btn block" data-act="go">${I.chat} Start chat</button></div>`,{
    sc:b=>{scId=b.dataset.id;if(!picked)pId=scOf().personaId||pre.personaId||defP;refresh()},
    p:b=>{pId=b.dataset.id;picked=true;refresh()},
    go:()=>{closeSheet();startChat(c.id,pId,scId)}
  });
  const refresh=()=>{
    $$('.sc-pick',pn).forEach(x=>x.classList.toggle('on',x.dataset.id===scId));$$('.p-pick',pn).forEach(x=>x.classList.toggle('on',x.dataset.id===pId));

  };
  refresh();
}

  const c=getChar(charId),scs=scenariosOf(c),sc=scs.find(s=>s.id===scenarioId)||scs[0];

const imgPreset=()=>S.settings.imgPresets?.find(p=>p.id===S.settings.imgPreset)||S.settings.imgPresets?.[0]||newImgPreset({name:'None'});

function withPreset(p,pr=imgPreset()){
  if(p.own)pr={artist:'',footer:'',uc:''}; // a prompt read from an image file already has its own artist and quality tags
  const foot=pr.footer?.trim()?'\n'+pr.footer.trim():'';

  const text=p.text?.trim()?'\nText: '+p.text.trim():'';

- One character prompt per visible person (${v5?'up to 22':'at most 6'}). Start it with girl, boy or other (no numbers). Then their Danbooru character tag if they are a known canon character (like fern (sousou no frieren)), appearance (hair, eyes, body, clothing), expression, pose and action. For interactions put source#action on the one acting and target#action on the one receiving, or mutual#action on both (like source#hug and target#hug).

- Emphasis: 1.3::tag:: only for what must stand out, always closed with ::.${st.imgMotion!==false?`

- Cartoonish faces (chibi, super deformed, jitome, @_@, x_x, >_<, o_o, solid circle eyes, chibi inset): ${{never:'never use them.',often:'use them freely whenever the mood is light or funny, and for every absurd moment (see below).'}[st.imgComic]||'use them for comedic, exaggerated or absurd moments; keep normal faces for sincerely serious, sad or romantic beats.'}${st.imgComic!=='never'?`
- Absurd moments get cartoonish faces no matter the mood of the scene: ridiculous situations, over-the-top reactions, deadpan nonsense, slapstick, someone doing something silly or out of character, a joke or misunderstanding in the middle of a serious, sad or romantic scene. Only the characters caught in the absurd beat get them (for example the one who says something ridiculous gets a smug or blank o_o face while the others get jitome or @_@); add chibi or super deformed if the absurdity is strong.`:''}
${textMode==='off'?'- Text: never put words, speech bubbles or thought bubbles in the image; leave "text" empty.'
:`- Text: ${textMode==='auto'?'when characters speak or think in this moment, show their words':'only when the user asks for speech bubbles, thought bubbles, signs or other text, show them; otherwise leave "text" empty and add no text tags'}. Add the tags text, ${v5?'english text (or japanese text if the user asks for Japanese)':'english text'}, and speech bubble or thought bubble; say in a short sentence who is speaking or thinking. Put the exact words in "text": one bubble per line in reading order, separated by a blank line, nothing else. Keep each bubble short (about 8 words) and all text under ${v5?360:110} characters.${v5?'':' English only.'}`}
- Comic pages: when asked for several panels in one image (a comic page, manga page or 4koma), add comic (and 4koma for a vertical four-panel strip), then describe the layout and each panel in reading order with short sentences in the base prompt, like "Panel 1, top left: ...". Keep each character's look and outfit identical in every panel.
${oneBox?`- Write everything as ONE prompt: the base prompt first, then each character's prompt, separated by " | " (like: 2girls, park, sunset | girl, red hair, smile | girl, blue hair, waving). No per-character undesired content, names or positions.`
:`- Character undesired: only traits that could leak in from OTHER characters in this image (like another character's hair color). Never this character's own traits. Empty if not needed.`}
- Undesired content: a short list of things to avoid in this image; the user adds their standard undesired tags themselves. Never put anything there that a character in the image has or does (their hair, eyes, clothes or other features), and nothing that appears in the prompts.
${oneBox?'':`- Position: a short hint for NovelAI's Character Positions canvas, like "left, foreground".\n`}${user}
${o.noCast?'':`
CHARACTERS (keep their look the same in every image. Looks and Usual outfit win over descriptions: when a description mentions other clothes, use the Usual outfit. Only the scene itself, or an "In this scenario" note, can change what they wear):
${cast.map(c=>`### ${c.name}\n${c.imageTags?`Looks (copy exactly, in this order, right after girl / boy / other): ${c.imageTags}`:`Description: ${(c.personality||'').slice(0,1500)}`}${c.outfitTags?`\nUsual outfit (use exactly, unless the scene calls for other clothes): ${c.outfitTags}`:''}${castNote(scn,c.id)?`\nIn this scenario (can change their age, clothes or look): ${castNote(scn,c.id)}`:''}`).join('\n\n')}
${char.kind==='world'?`\nWORLD (other characters may appear too): ${(char.personality||'').slice(0,2500)}\n${worldLinks(char,scn)?worldLinks(char,scn)+'\n':''}`
  :cw?`\nWORLD ${char.name} LIVES IN (${cw.name}): ${(cw.personality||'').slice(0,1500)}\n${ownLinks(cw,char).length?`${char.name}'s relationships:\n${ownLinks(cw,char).join('\n')}\n`:''}`:''}`}${loreBlock(o.lore,true)}`;
}

const panelJson=(fmt=S.settings.imgOutput)=>fmt==='onebox'?'{"caption":"one sentence","prompt":"base prompt | girl, ... | boy, ...","text":"bubble text or \\"\\"","undesired":"..."}'

async function unzipFirst(buf){

  const start=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),raw=new Uint8Array(buf,start,size);

async function naiGenerate(p,signal){

  if(naiBusy)throw new Error('NovelAI makes one image at a time. Wait for the one that is being made.');

    const r=await fetch(naiUrl()+'/ai/generate-image',{method:'POST',signal,headers:{'Authorization':'Bearer '+S.settings.naiToken.trim(),'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(naiRequest(p,seed))});

function storyText(chat,char,room=60000){

async function runBoard(chat,char,items,o){

    entry:addImage(chat,[],`The whole chat, ${items.length} image${items.length===1?'':'s'}${o.wish?`: ${o.wish}`:''}`,'board',o.usage?{...o.usage}:null)};

async function workBoard(chat,char,run,list,o){
  const {ac,entry}=run;
  for(const x of list){
    if(ac.signal.aborted)break;
    x.state='busy';delete x.err;drawBoardRun(chat);
    try{
      const r=await makeImagePrompt(chat,char,x.to-1,{range:[x.from-1,x.to-1],moment:x.moment,panels:1,text:o.text,signal:ac.signal});
      x.p=r.panels[0];if(x.title)x.p.caption=x.title;x.state='done';
      entry.panels=run.items.filter(y=>y.p).map(y=>y.p);entry.usage=sumUse(entry.usage,r.usage);await saveChat(chat);
    }catch(e){x.state=ac.signal.aborted?'wait':'fail';x.err=e.message}
    drawBoardRun(chat);
  }
  if(boardBusy.get(chat.id)!==run)return;
  boardBusy.delete(chat.id);
  if(!entry.panels.length){chat.images=(chat.images||[]).filter(e=>e!==entry);await saveChat(chat)}
  const done=run.items.filter(x=>x.p).length;
  if(drawBoardRun(chat,run))return;
  toast(done?`Storyboard ready: ${done} of ${run.items.length} prompts. ⋮ → Image prompt / storyboard → History`:'The storyboard was stopped before any prompt was written',5000);
}

function imageStoryPrompt(chat,char,history,notes){
  const su=storyUser(chat),imgs=history.filter(m=>m.role==='assistant'&&m.imgs?.[m.sw]).map(m=>m.imgs[m.sw]);
  const talk=history.slice(-12).map(m=>m.role==='user'?`USER: ${txt(m)}`:`YOU: ${txt(m)}${m.imgs?.[m.sw]?` [made image: ${m.imgs[m.sw].caption}]`:''}${m.next?.[m.sw]?` [suggested next: ${m.next[m.sw]}]`:''}`).join('\n');
  const last=imgs.at(-1),len=S.settings.imgStoryText||'short';
  const prose=history.filter(m=>m.role==='assistant'&&m.imgs?.[m.sw]&&m.story?.[m.sw]).slice(-4).map(m=>m.story[m.sw]);
  const storyKey=len==='off'?'':`,"story":"${len==='long'?'1 to 3 short paragraphs':'2 to 4 sentences'} of story text shown under this image, like an illustrated novel: ${storyVoice(chat)}, what happens in this picture and what the characters say, think or feel (dialogue in quotes). Continue smoothly from the story text so far. Never describe the art or mention prompts. ${su.text} When remaking the last image, keep its story text unless the change affects it. \\"\\" when there is no image"`;
  return `We are making a sequence of images that tell a story with ${char.kind==='world'?`characters from ${char.name}`:char.name}. ${su.intro}

STORY OUTLINE: ${chat.storyOutline?.trim()||'(not set yet)'}

IMAGES SO FAR (${imgs.length}):
${imgs.slice(-8).map((p,i)=>`${imgs.length-Math.min(8,imgs.length)+i+1}. ${p.caption}`).join('\n')||'(none yet)'}
${last?`\nLAST IMAGE IN FULL: ${JSON.stringify(last)}\n`:''}${len!=='off'?`\nSTORY TEXT SO FAR (under the latest images):\n${prose.join('\n\n')||'(none yet)'}\n`:''}
CONVERSATION:
${talk}

WHAT TO DO WITH THE USER'S LAST MESSAGE:
- If they tell you what the story is about, or nothing has been planned yet: don't make an image. Write a short story outline and suggest the first scene.
- If they describe a scene, or accept your suggestion (like "ok", "yes", "next", "go"): make the image for that scene, continuing the story and keeping characters' looks and outfits the same as earlier images.
- If they ask to change the last image (like "make her smile" or "no sword"): remake the last image with that change and keep everything else the same.
- If something is unclear, ask one short question instead of making an image.
Always suggest a next scene that moves the story forward.
${notes?`
THE USER IS REDOING YOUR ANSWER TO THEIR LAST MESSAGE.${notes.prev?` Your previous version: ${JSON.stringify({reply:notes.prev.reply,image:notes.prev.img?.caption||null,story:notes.prev.story||''})}`:''}
${notes.want?`They want: ${notes.want}\n`:''}${notes.avoid?`They don't want: ${notes.avoid}\n`:''}Make a new version that follows these wishes, for both the image and the story text. Keep everything they didn't mention.
`:''}
${novelRules(chat,char,{story:true,lore:sceneLore(chat,char,[talk,prose.join('\n'),chat.storyOutline,notes?.want])})}
Return one JSON object only:
{"reply":"1 or 2 friendly sentences to the user","outline":"the updated story outline in one short paragraph, or \\"\\" if unchanged","image":${panelJson()} or null,"remake":true if the image remakes the last image with a change, otherwise false${storyKey},"next":"the suggested next scene in one sentence"}`;
}

// one section per image, in order; a remade image takes the place of the one before it
function storySections(chat){
  const out=[];
  chat.messages.forEach((m,i)=>{
    if(m.role!=='assistant'||!m.imgs?.[m.sw])return;
    const s={i,m,img:m.imgs[m.sw],story:m.story?.[m.sw]||'',pics:m.pics?.[m.sw]||[]};
    if(m.remake?.[m.sw]&&out.length){const prev=out.pop();if(!s.pics.length)s.pics=prev.pics;if(!s.story)s.story=prev.story}
    out.push(s);
  });

// NovelAI also hides its metadata in the lowest bit of each pixel's alpha, column by column: "stealth_pngcomp", a 32-bit length in bits, then gzipped JSON.
async function readStealth(file){
  let bmp;try{bmp=await createImageBitmap(file,{premultiplyAlpha:'none',colorSpaceConversion:'none'})}catch{return null}

  const d=x.getImageData(0,0,w,h).data;let cx=0,cy=0;
  const bit=()=>{const b=d[(cy*w+cx)*4+3]&1;if(++cy===h){cy=0;cx++}return b};
  const bytes=n=>{const o=new Uint8Array(n);for(let i=0;i<n;i++){let v=0;for(let k=0;k<8;k++)v=v<<1|bit();o[i]=v}return o};
  const magic=new TextDecoder().decode(bytes(15));if(magic!=='stealth_pngcomp'&&magic!=='stealth_pnginfo')return null;
  const n=new DataView(bytes(4).buffer).getUint32(0)/8;if(!n||n*8+152>w*h)return null;
  let data=bytes(n);
  if(magic==='stealth_pngcomp')data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  const t=new TextDecoder().decode(data);
  try{return JSON.parse(t)}catch{return {parameters:t}}
}

const IMG_POS=[['','AI chooses'],['left, top','Top left'],['center, top','Top'],['right, top','Top right'],['left','Left'],['center','Center'],['right','Right'],['left, bottom','Bottom left'],['center, bottom','Bottom'],['right, bottom','Bottom right']];
const posOption=s=>{const c=naiCenter(s);if(!c)return '';const x=c.x<.5?'left':c.x>.5?'right':'center',y=c.y<.5?', top':c.y>.5?', bottom':'';return x==='center'&&!y?'center':x+y};
let imgPage=null,imgSaveT=0;

const formPanel=f=>({caption:'',base:f.base.trim(),undesired:f.uc.trim(),text:'',own:!f.usePreset,
  characters:f.chars.filter(c=>c.prompt.trim()).map(c=>({name:'',prompt:c.prompt.trim(),undesired:c.uc.trim(),position:c.pos}))});
// the AI writes for a made-up "world" holding the characters you picked, so it knows their looks
function imgAiCtx(who){

  return {char:{id:'_images',kind:'world',name:'this picture',personality:'Draw only who and what the request asks for.',members:ids},
    chat:{id:'_images',messages:[],personaId:personaFor(null)?.id,...(me?{}:{origin:{role:'direct'}})}};
}

  const cur=personaFor(chat)?.id,back=()=>{redraw();openChatPersona(chat,redraw)};
  openSheet(`<h2>Persona for this chat</h2><p class="hint">Tap one to be them in this chat. ${I.edit} edits it.</p><div class="list">${S.personas.map(p=>`<div class="li ${p.id===cur?'on':''}" data-act="pick" data-id="${p.id}"><img src="${esc(avatar(p))}" alt=""><div class="lt"><b>${esc(p.name)}</b><span>${esc(p.description||'No description')}</span></div><button class="btn ghost sm" data-act="edit" data-id="${p.id}" title="Edit">${I.edit}</button></div>`).join('')}</div>
    <button class="btn ghost block" data-act="add" style="margin-top:10px">${I.plus} New persona</button>`,{
    pick:async b=>{chat.personaId=b.dataset.id;await saveChat(chat);closeSheet();redraw();toast(`You are ${personaFor(chat).name} in this chat`)},
    edit:b=>editPersona(S.personas.find(p=>p.id===b.dataset.id),false,back),
    add:()=>editPersona({id:uid(),name:'',description:'',avatar:null},true,async w=>{chat.personaId=w.id;await saveChat(chat);back()})});
}

  openSheet(`<h2>${isNew?'New persona':'Edit persona'}</h2>
    <div class="pics"><div class="pic av" data-act="pick" id="ppav" style="width:90px;height:90px;border-radius:50%">${w.avatar?`<img src="${esc(w.avatar)}">`:'Add<br>picture'}</div></div>

    <label class="f">Image tags<small>your look in NovelAI image prompts</small></label><input id="pit" value="${esc(w.imageTags||'')}" placeholder="e.g. 1boy, short black hair, brown eyes, knight armor" autocapitalize="off">
    <label class="f">Prompt preset<small>used in this persona's chats</small></label><select id="ppr"><option value="">Use the default (${esc(S.settings.prompts.find(x=>x.id===S.settings.defaultPrompt)?.name||'none')})</option>${S.settings.prompts.map(x=>`<option value="${x.id}" ${w.promptId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <div class="hint">Tip: make an “Observer” persona that uses the Observer / narrator preset, and pick it whenever you want to watch instead of play.</div>
    <br><br><div class="row"><button class="btn" data-act="save" style="flex:2">Save</button>${!def&&!isNew?'<button class="btn ghost" data-act="def" style="flex:1">Make default</button>':''}</div>
    ${!isNew&&S.personas.length>1?'<br><button class="btn danger block" data-act="del">Delete persona</button>':''}`,{
    pick:async b=>{const [f]=await pickFiles('image/*');if(!f)return;w.avatar=await fileToImage(f,512);b.innerHTML=`<img src="${esc(w.avatar)}">`},
    save:async()=>{w.name=$('#pn').value.trim()||'You';w.description=$('#pd').value;w.promptId=$('#ppr').value;w.imageTags=$('#pit').value.trim();const i=S.personas.findIndex(x=>x.id===w.id);if(i<0)S.personas.push(w);else S.personas[i]=w;await savePersonas();closeSheet();after(w)},
    def:async()=>{S.settings.activePersona=p.id;await saveSettings();closeSheet();after(w)},
    del:async()=>{if(!confirm('Delete this persona?'))return;S.personas=S.personas.filter(x=>x.id!==p.id);if(S.settings.activePersona===p.id){S.settings.activePersona=S.personas[0].id;await saveSettings()}await savePersonas();closeSheet();after()}
  });
}

// falls back to another model (fallback) that the test then checks instead.
const MODEL_FIELDS={
  sceneModel:{conn:()=>activeApi(),fallback:()=>''},
  visionModel:{conn:()=>S.settings.apis.find(a=>a.id===S.settings.visionApi)||activeApi(),fallback:()=>'',vision:true},
  researchModel:{conn:()=>S.settings.apis.find(a=>a.id===S.settings.researchApi)||activeApi(),fallback:()=>''},
  wizardResearchModel:{conn:()=>S.settings.apis.find(a=>a.id===S.settings.researchApi)||activeApi(),fallback:()=>S.settings.researchModel||''}
};
const modelTools=k=>`<datalist id="dl-${k}"></datalist><div class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="mfetch" data-field="${k}">Fetch models</button><button class="btn ghost sm" data-act="mtest" data-field="${k}">Test</button></div><div class="small" id="mres-${k}" style="margin-top:4px"></div>`;
// the models a connection offers (only image-capable ones when asked and the list says), remembered while the app is open
async function listModels(api,vision){
  const memo=(S.ui.models??={}),key=api.url+'|'+(api.key||'').slice(-6);
  if(!memo[key]){const res=await fetch(modelsUrl(api.url),{headers:api.key?{Authorization:'Bearer '+api.key.trim()}:{}});if(!res.ok)throw new Error('HTTP '+res.status);const j=await res.json();memo[key]=(j.data||j.models||[]).map(m=>typeof m==='string'?{id:m}:m).filter(m=>m?.id||m?.name)}
  const all=memo[key],known=all.some(m=>m.architecture?.input_modalities);
  return all.filter(m=>!vision||!known||m.architecture?.input_modalities?.includes('image')).map(m=>m.id||m.name).sort();
}
