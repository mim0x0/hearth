  <div class="sec"><h3>Backup</h3><div class="box"><p class="small muted" style="margin-top:0">Everything is stored only in this browser on this device. Keep backups, especially before clearing browser data or moving the app file.</p>
    <div class="small" id="stor-info" style="margin-bottom:10px">Checking storage…</div>
    <label class="f" style="margin-top:0">Auto backup</label><select data-k="autoBackup">${[[0,'Off'],[1,'Every day'],[3,'Every 3 days'],[7,'Every week']].map(([v,l])=>`<option value="${v}" ${+st.autoBackup===v?'selected':''}>${l}</option>`).join('')}</select>
    <div class="hint">When a backup is due, the next time you tap anywhere in the app a backup file is saved to your Downloads folder. Last backup: <b id="lastbk">${st.lastBackup?new Date(st.lastBackup).toLocaleString():'never'}</b></div>
    ${tg('backupKeys','Include API keys in auto backups','Leave off if you might share backup files.')}
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="backup" style="flex:1">${I.exp} Export backup</button><button class="btn ghost" data-act="restore" style="flex:1">${I.imp} Import backup</button></div>
    <br><button class="btn danger block" data-act="wipe">Delete all data</button></div></div>
  <div class="sec"><h3>Personas</h3><div class="box"><div class="small">Who you are in the story: ${S.personas.length} persona${S.personas.length===1?'':'s'}, default ${esc(personaFor(null)?.name||'none')}. You can also change them in a chat under ⋮ → Persona for this chat.</div><button class="btn ghost sm" data-act="personas" style="margin-top:8px">${I.user} Manage personas</button></div></div>
  <div class="sec"><h3>Usage and cost</h3><div class="box"><div id="use-sum" class="small">Adding up…</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="usage">${I.brain} See everything</button></div>
    <div class="hint">Every request Hearth sends is counted here: replies, scene tracking, memory, research, wizards, image prompts, scene setups and tests. Costs with ≈ are estimates from the connection's prices.</div></div></div>
  <div class="sec"><h3>About</h3><div class="box"><b>Hearth ${HEARTH_VERSION}</b> <span class="muted small">· updated ${new Date(HEARTH_DATE+'T12:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})} · ${store.ls?'localStorage':'IndexedDB'} storage</span>
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="upd-check">${I.regen} Check for updates</button><span id="upd-msg" class="small muted"></span></div></div></div>
  <div style="padding-bottom:30px"></div>`;
  const host=$('.scripts-host',view);
  const save=()=>{if(host.isConnected)S.settings.globalScripts=readScripts(host);saveSettings()};
  let tmr;const deb=()=>{clearTimeout(tmr);tmr=setTimeout(save,400)};
  view.oninput=e=>{const t=e.target,k=t.dataset.k;
    if(t.classList.contains('bk-on')){const bk=S.lorebooks.find(x=>x.id===t.dataset.id);if(bk){bk.enabled=t.checked;saveBooks()}return}if(k){S.settings[k]=t.type==='checkbox'?t.checked:(t.type==='range'||t.type==='number')?+t.value:t.value;const v=$('#v-'+k);if(v)v.textContent=t.value;if(k==='fontSize')applyFont();if(k==='autoBackup')armAutoBackup();if(k==='researchMode')$('#rs-box').hidden=t.value!=='model'}deb()};
  view.onchange=view.oninput;
  // where the data lives, whether the browser will keep it, and how much space it uses
  (async()=>{
    const p=await keepStorage(false);let use='';
    try{const e=await navigator.storage?.estimate?.();if(e?.usage!=null)use=`<br><b>Space used:</b> ${fmtSize(e.usage)}${e.quota?` of about ${fmtSize(e.quota)} allowed`:''}`}catch{}
    const el=$('#stor-info',view);if(!el)return;
    el.innerHTML=`<b>Where:</b> ${tempLink()?'<span class="err">a temporary link</span>: refreshing won\'t work and the data may not be kept. <a href="#" data-act="tb-how" style="color:var(--accent)">How to fix</a>':location.protocol==='file:'?'a file on this device (keep opening the same file)':esc(location.host)}
      <br><b>Kept permanently:</b> ${p===true?'<span class="okc">yes</span>, the browser won\'t clear it to free space':p===false?`not yet <button class="btn ghost sm" data-act="st-keep">Ask the browser</button>`:'unknown (this browser doesn\'t say)'}${use}`;
  })();
  usageList().then(log=>{const el=$('#use-sum');if(!el)return;const d=new Date(),day=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),mon=new Date(d.getFullYear(),d.getMonth(),1).getTime();
    el.innerHTML=`Today: <b>${usageSum(log.filter(e=>e.t>=day)).text}</b><br>This month: <b>${usageSum(log.filter(e=>e.t>=mon)).text}</b>`});
  H={usage:()=>openUsage(),personas:()=>go('#/profile'),api:b=>editApi(st.apis.find(a=>a.id===b.dataset.id)),'api-new':()=>editApi(null),
    'st-keep':async()=>{const p=await keepStorage(true);toast(p?'The browser will keep Hearth\'s data.':'The browser said no for now. It usually agrees once Hearth is added to the home screen, or after you use it for a while.',6000);vSettings()},
    book:b=>{const bk=S.lorebooks.find(x=>x.id===b.dataset.id);openBookEditor(bk,{title:'Lorebook',onSave:async nb=>{Object.assign(bk,nb);await saveBooks();vSettings()},onDelete:async()=>{S.lorebooks=S.lorebooks.filter(x=>x.id!==bk.id);await saveBooks();vSettings()}})},
    'book-new':()=>openBookEditor(newBook('New lorebook'),{title:'New lorebook',onSave:async nb=>{S.lorebooks.push(nb);await saveBooks();vSettings()}}),
    'book-import':async()=>addGlobalBook(await pickBookFile()),
    'book-paste':()=>openPasteBook(addGlobalBook),
    ipr:b=>editImgPreset(st.imgPresets.find(p=>p.id===b.dataset.id)),
    naicheck:async b=>{
      const tok=$('[data-k=naiToken]',view).value.trim(),r=$('#nai-res');if(!tok){r.innerHTML='<span class="err">Paste your token first.</span>';return}
      b.disabled=true;r.className='small muted';r.textContent='Asking NovelAI…';
      try{const a=await naiAccount(tok);r.className='small';r.innerHTML=a.active?`<span class="okc">Works.</span> ${esc(a.tier)}, ${a.anlas.toLocaleString()} Anlas.`:`<span class="err">The token works, but there's no active subscription (${esc(a.tier)}).</span> ${a.anlas.toLocaleString()} Anlas.`}
      catch(e){r.className='small';r.innerHTML=`<span class="err">${esc(e.message)}</span>`}finally{b.disabled=false}},
    mfetch:async b=>{
      const k=b.dataset.field,f=MODEL_FIELDS[k],api=f.conn(),r=$('#mres-'+k);r.className='small';
      if(!api){r.innerHTML='<span class="err">Add a connection first.</span>';return}
      r.textContent='Loading models…';b.disabled=true;
      try{const ids=await listModels(api,f.vision);$('#dl-'+k).innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');
        r.innerHTML=`<span class="okc">${ids.length} models${f.vision?' that can see images':''} from ${esc(api.name||api.url)}.</span> Tap the box above to pick one.`}
      catch(e){r.innerHTML=`<span class="err">Could not list models (${esc(e.message)}). Type the model name instead.</span>`}
      finally{b.disabled=false}},
    mtest:async b=>{
      const k=b.dataset.field,f=MODEL_FIELDS[k],base=f.conn(),r=$('#mres-'+k);r.className='small';
      if(!base){r.innerHTML='<span class="err">Add a connection first.</span>';return}
      const typed=$(`[data-k=${k}]`,view).value.trim(),model=typed||f.fallback().trim()||base.model,api={...base,model};
      r.textContent=`Testing ${model}${typed?'':' (the box is empty, so this is what gets used)'}…`;b.disabled=true;
      try{
        if(f.vision){
          // a red square: a model that can't see images either errors or can't name the color
          const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.fillStyle='#d22';x.fillRect(0,0,32,32);
          const {text}=await callApi(api,[{role:'user',content:[{type:'text',text:'What color is this square? Reply with one word.'},{type:'image_url',image_url:{url:c.toDataURL('image/png')}}]}],undefined,()=>{},{stream:false,maxTokens:400});
          const said=stripThink(text||'').trim().slice(0,40);
          r.innerHTML=/red/i.test(said)?`<span class="okc">Works, and it can see images.</span> ${esc(model)} saw a “${esc(said)}” square.`:`<span class="err">${esc(model)} answered but didn't see the red square</span> (“${esc(said)||'empty'}”). Pick a model that can see images.`;
        }else{
          const {text,thought}=await callApi(api,[{role:'user',content:'Reply with just the word OK.'}],undefined,()=>{},{stream:false,maxTokens:400});
          r.innerHTML=`<span class="okc">Works.</span> ${esc(model)} ${testSaid(text,thought)}`;
        }
      }catch(e){r.innerHTML=`<span class="err">${esc(model)}: ${esc(e.message)}</span>`}
      finally{b.disabled=false}},
    vsm:b=>{const i=$('#vs-m');i.value=b.dataset.m;i.dispatchEvent(new Event('input',{bubbles:true}))},
    rsw:b=>{const i=$('#rs-w');i.value=b.dataset.m;i.dispatchEvent(new Event('input',{bubbles:true}))},
    rsm:b=>{const i=$('#rs-m'),m=b.dataset.m;i.value=m===':online'?(i.value.trim()?i.value.trim().replace(/:online$/,'')+':online':'openai/gpt-4o-mini:online'):m;i.dispatchEvent(new Event('input',{bubbles:true}))},
    'ipr-new':()=>editImgPreset(newImgPreset(),true),
    'web-test':async()=>{const q=prompt('Look up what? Add "@wiki" to use a Fandom wiki, e.g. "Himmel @frieren"','Frieren');if(!q)return;
      const [query,w]=q.split('@').map(s=>s.trim());openSheet('<h2>Test lookup</h2><p class="muted">Searching…</p>');
      try{const r=await wikiSearch(query,w||'wikipedia');openSheet(`<h2>${esc(wikiLabel(w))} results</h2><div class="box pre small">${esc(r)}</div><br><button class="btn ghost block" data-act="close">Close</button>`)}
      catch(e){openSheet(`<h2 class="err">Lookup failed</h2><p>${esc(e.message)}</p><button class="btn ghost block" data-act="close">Close</button>`)}},
    prompt:b=>editPrompt(st.prompts.find(p=>p.id===b.dataset.id)),
    'prompt-new':()=>editPrompt({id:uid(),name:'',text:''},true),
    'prompt-restore':async()=>{const add=BUILTIN_PROMPTS.filter(b=>!st.prompts.some(p=>p.id===b.id));st.prompts.push(...clone(add));await saveSettings();toast(add.length?`Restored ${add.length} preset${add.length>1?'s':''}`:'All built-in presets are already there');vSettings()},
    backup:exportBackup,restore:async()=>{const [f]=await pickFiles('.json,application/json');if(!f)return;try{await importBackup(JSON.parse(await readAs(f,'readAsText')))}catch(e){toast('Import failed: '+e.message,5000)}},
    wipe:async()=>{if(!confirm('Delete ALL characters, chats, personas and settings on this device?'))return;if(!confirm('Really? Export a backup first if unsure.'))return;await store.clear();location.hash='';location.reload()}};
  const addGlobalBook=async nb=>{if(!nb)return;S.lorebooks.push(nb);await saveBooks();toast(`Added “${nb.name}” (${nb.entries.length} entr${nb.entries.length===1?"y":"ies"})`);vSettings()};
  // scripts edits/add/remove also need saving
  new MutationObserver(deb).observe(host,{childList:true,subtree:true});
}
function editPrompt(p,isNew){
  const st=S.settings,w={...p},isDef=st.defaultPrompt===p.id,users=S.personas.filter(x=>x.promptId===p.id).map(x=>x.name);
  openSheet(`<h2>${isNew?'New prompt preset':'Edit prompt preset'}</h2>
    <label class="f">Name</label><input id="prn" value="${esc(w.name)}" placeholder="e.g. Slow-burn romance">
    <label class="f">Prompt<small>{{char}} and {{user}} are replaced</small></label><textarea id="prt" rows="12">${esc(w.text)}</textarea>
    ${users.length?`<div class="hint">Used by persona: ${users.map(esc).join(', ')}</div>`:''}
    <div class="sheet-foot row"><button class="btn ghost" data-act="close" style="flex:1">Cancel</button>${!isDef&&!isNew?'<button class="btn ghost" data-act="def" style="flex:1">Make default</button>':''}<button class="btn" data-act="save" style="flex:1">${I.check} Save</button></div>
    ${!isNew&&st.prompts.length>1?'<button class="btn danger block" data-act="del">Delete preset</button>':''}`,{
    save:async()=>{w.name=$('#prn').value.trim()||'Untitled';w.text=$('#prt').value;const i=st.prompts.findIndex(x=>x.id===w.id);if(i<0)st.prompts.push(w);else st.prompts[i]=w;await saveSettings();closeSheet();vSettings()},
    def:async()=>{st.defaultPrompt=p.id;await saveSettings();closeSheet();vSettings()},
    del:async()=>{if(!confirm('Delete this prompt preset? Personas and chats using it will switch to the default.'))return;st.prompts=st.prompts.filter(x=>x.id!==p.id);if(st.defaultPrompt===p.id)st.defaultPrompt=st.prompts[0].id;await saveSettings();closeSheet();vSettings()}
  },{modal:true});
}
function editApi(a){
  const isNew=!a;const w=a?{...a}:{id:uid(),name:'',url:'',key:'',model:''};const st=S.settings;
  openSheet(`<h2>${isNew?'Add connection':'Edit connection'}</h2>
    <label class="f">Name</label><input id="an" value="${esc(w.name)}" placeholder="e.g. My proxy">
    <label class="f">Proxy / API URL</label><input id="au" type="url" value="${esc(w.url)}" placeholder="https://…/v1 or …/v1/chat/completions" autocapitalize="off">
    <div class="chips"><span class="chip" data-act="preset" data-u="https://openrouter.ai/api/v1">OpenRouter</span><span class="chip" data-act="preset" data-u="https://api.deepseek.com/v1">DeepSeek</span><span class="chip" data-act="preset" data-u="https://api.openai.com/v1">OpenAI</span></div>
    <div class="hint" id="aurl"></div>
    <label class="f">API key<small>stored only on this device</small></label><input id="ak" type="password" value="${esc(w.key)}" placeholder="sk-…" autocomplete="off" autocapitalize="off">
    <label class="f">Model</label><input id="am" value="${esc(w.model)}" list="mlist" placeholder="e.g. deepseek/deepseek-chat-v3" autocapitalize="off"><datalist id="mlist"></datalist>
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="models">Fetch models</button><button class="btn ghost sm" data-act="test">Test connection</button></div>
    <div class="grid2"><div><label class="f">Price in<small>$ per 1M tokens</small></label><input id="api-pin" type="number" min="0" step="0.01" value="${w.priceIn||''}" placeholder="optional"></div>
      <div><label class="f">Price out<small>$ per 1M tokens</small></label><input id="api-pout" type="number" min="0" step="0.01" value="${w.priceOut||''}" placeholder="optional"></div></div>
    <div class="hint">Only for showing costs under messages. OpenRouter reports the exact cost of every request by itself, so leave these empty there. For other proxies, enter the model's prices; they're used only while this model is set.</div>
    <div id="ares" class="small" style="margin-top:8px"></div>
    <br><div class="row"><button class="btn" data-act="save" style="flex:2">Save${isNew?' & use':''}</button>${!isNew&&st.activeApi!==w.id?'<button class="btn ghost" data-act="use" style="flex:1">Use</button>':''}${!isNew?`<button class="btn ghost" data-act="dup" style="flex:1">${I.copy} Duplicate</button>`:''}</div>
    ${!isNew?'<br><button class="btn danger block" data-act="del">Delete connection</button>':''}`,{
    preset:b=>{$('#au').value=b.dataset.u;showUrl()},
    models:async()=>{const r=$('#ares');r.textContent='Loading models…';r.className='small';try{const k=$('#ak').value.trim();const res=await fetch(modelsUrl($('#au').value),{headers:k?{Authorization:'Bearer '+k}:{}});if(!res.ok)throw new Error('HTTP '+res.status);const j=await res.json();const ids=(j.data||j.models||[]).map(m=>m.id||m.name||m).filter(x=>typeof x==='string').sort();$('#mlist').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');r.innerHTML=`<span class="okc">${ids.length} models found.</span> Tap the model box to pick one.`}catch(e){r.innerHTML=`<span class="err">Could not list models (${esc(e.message)}). Type the model name instead.</span>`}},
    test:async()=>{const r=$('#ares');r.textContent='Testing…';r.className='small';const t={...w,url:$('#au').value,key:$('#ak').value,model:$('#am').value.trim()};
      try{const {text:out,thought}=await callApi(t,[{role:'user',content:'Reply with just the word OK.'}],undefined,()=>{},{stream:false,maxTokens:30});r.innerHTML=`<span class="okc">Connected!</span> ${t.model?esc(t.model)+' ':''}${testSaid(out,thought)}`}catch(e){r.innerHTML=`<span class="err">${esc(e.message)}</span>`}},
    save:async()=>{w.name=$('#an').value.trim()||'Connection';w.url=$('#au').value.trim();w.key=$('#ak').value.trim();w.model=$('#am').value.trim();if(!w.url){toast('Enter the proxy URL');return}
      w.priceIn=Math.max(0,+$('#api-pin').value||0);w.priceOut=Math.max(0,+$('#api-pout').value||0);w.priceModel=w.priceIn||w.priceOut?w.model:'';
      const i=st.apis.findIndex(x=>x.id===w.id);if(i<0){st.apis.push(w);st.activeApi=w.id}else st.apis[i]=w;if(!st.activeApi)st.activeApi=w.id;await saveSettings();closeSheet();vSettings()},
    use:async()=>{st.activeApi=w.id;await saveSettings();closeSheet();vSettings()},
    // a copy of this connection as it is in the form (same URL, key and prices), e.g. to keep one per model; opens the copy
    dup:async()=>{
      const pin=Math.max(0,+$('#api-pin').value||0),pout=Math.max(0,+$('#api-pout').value||0),model=$('#am').value.trim();
      const c={...w,id:uid(),name:`${$('#an').value.trim()||w.name||'Connection'} (copy)`,url:$('#au').value.trim(),key:$('#ak').value.trim(),model,priceIn:pin,priceOut:pout,priceModel:pin||pout?model:''};
      st.apis.push(c);await saveSettings();closeSheet();vSettings();toast('Copied. Change what you need, then tap Save.');editApi(c)},
    del:async()=>{if(!confirm('Delete this connection?'))return;st.apis=st.apis.filter(x=>x.id!==w.id);if(st.activeApi===w.id)st.activeApi=st.apis[0]?.id||null;await saveSettings();closeSheet();vSettings()}
  });
  const showUrl=()=>{const u=$('#au').value.trim();$('#aurl').textContent=u?'Requests go to: '+endpoint(u):''};$('#au').oninput=showUrl;showUrl();
}
function applyFont(){document.documentElement.style.setProperty('--fs',(S.settings.fontSize||15)+'px')}

/* ---------- backup ---------- */
// every gallery and profile picture, so a backup restores them too
async function allPictures(){
  const ids=new Set(S.chars.flatMap(c=>[...(c.gallery||[]).map(g=>g.id),...(c.avatarPool||[])])),out=[];
  for(const id of ids){const d=await getImgData(id);if(d)out.push({id,data:d})}
  return out;
}
async function exportBackup(auto){
  auto=auto===true;
  const inclKeys=auto?!!S.settings.backupKeys:confirm('Include your API keys in the backup?\n\nOK = include keys\nCancel = leave keys out (safer to share)');
  const chats=[];for(const c of S.chatIndex){const x=await loadChat(c.id);if(x)chats.push(x)}
  const settings=clone(S.settings);if(!inclKeys){settings.apis.forEach(a=>a.key='');settings.naiToken=''}
  download(`hearth-backup-${new Date().toISOString().slice(0,10)}${auto?'-auto':''}.json`,JSON.stringify({hearthBackup:1,exported:Date.now(),chars:S.chars,personas:S.personas,lorebooks:S.lorebooks,settings,chats,images:await allPictures()}));
  S.settings.lastBackup=Date.now();await saveSettings();
  const lb=$('#lastbk');if(lb)lb.textContent=new Date().toLocaleString();
}
let backupArmed=false;
const backupDue=()=>+S.settings.autoBackup>0&&Date.now()-(+S.settings.lastBackup||0)>=+S.settings.autoBackup*864e5;
function armAutoBackup(){
  if(backupArmed||!backupDue())return;backupArmed=true;
  // browsers only allow a download right after a tap, so save on the next one
  document.addEventListener('click',async()=>{backupArmed=false;if(!backupDue())return;
    try{await exportBackup(true);toast('Auto backup saved to your Downloads folder',4000)}catch(e){toast('Auto backup failed: '+e.message,5000)}},{once:true,capture:true});
}
async function importBackup(j){
  if(!j.hearthBackup)throw new Error('This is not a Hearth backup file');
  if(!confirm(`Import ${j.chars?.length||0} characters and ${j.chats?.length||0} chats? Items with the same ID will be replaced.`))return;
  const merge=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));(b||[]).forEach(x=>m.set(x.id,x));return[...m.values()]};
  // a new device only has the blank starter persona: the backup's personas replace it instead of sitting next to it
  const starter=S.personas.length===1&&S.personas[0].name==='You'&&!S.personas[0].description&&!S.personas[0].avatar&&!S.personas[0].imageTags;
  if(starter&&j.personas?.length)S.personas=[];
  S.chars=merge(S.chars,j.chars);S.personas=merge(S.personas,j.personas);S.lorebooks=merge(S.lorebooks,j.lorebooks);
  if(j.settings){const keep=S.settings.apis;const apis=(j.settings.apis||[]).map(a=>a.key?a:{...a,key:keep.find(k=>k.id===a.id)?.key||''});S.settings={...DEFAULTS,...j.settings,apis:merge(keep,apis),naiToken:j.settings.naiToken||S.settings.naiToken||''}}
  ensurePrompts();ensureImgPresets();migrateChars();
  for(const c of j.chats||[]){chatCache.delete(c.id);await saveChat(c,true)}
  for(const p of j.images||[])if(p?.id&&p.data){await store.set('img:'+p.id,{id:p.id,data:p.data,at:Date.now()});imgCache.set(p.id,p.data)}
  await saveChars();await savePersonas();await saveBooks();await saveSettings();applyFont();toast('Backup imported');route();
}

/* ---------- boot ---------- */
(async()=>{
  await store.init();
  S.chars=await store.get('chars')||[];
  S.personas=await store.get('personas')||[];
  if(!S.personas.length){S.personas=[{id:uid(),name:'You',description:'',avatar:null}];await savePersonas()}
  S.settings={...DEFAULTS,...(await store.get('settings')||{})};
  S.chatIndex=await store.get('chatIndex')||[];
  S.lorebooks=await store.get('lorebooks')||[];
  await preloadAvatars();
  if(ensurePrompts()|ensureImgPresets())await saveSettings();
  if(migrateChars())await saveChars();
  applyFont();
  keepStorage(true);showTempBar();setTimeout(()=>checkUpdate(false),4000);
  armAutoBackup();setInterval(armAutoBackup,30*60e3);
  addEventListener('hashchange',route);
  addEventListener('beforeunload',e=>{if(dirty||GEN){e.preventDefault();e.returnValue=''}});
  route();
})();
</script>
